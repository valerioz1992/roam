name: Extract country photos

on:
  push:
    branches: [main]
    paths:
      - 'roam-country-photos-optimized.zip'
      - '.github/workflows/extract-country-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract optimized country photos
        run: |
          unzip -o roam-country-photos-optimized.zip -d .
          test -s assets/country-photos/Afghanistan.webp
          test -s assets/country-photos/Albania.webp
          test -s assets/country-photos/Algeria.webp
          test -s assets/country-photos/Andorra.webp
          test -s assets/country-photos/Angola.webp
      - name: Commit extracted images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/country-photos/*.webp
          if git diff --cached --quiet; then
            echo "No photo changes to commit"
          else
            git commit -m "Add optimized country photos"
            git push origin HEAD:main
          fi
